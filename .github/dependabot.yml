version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - '@typescript-eslint/*'
          - eslint-plugin-*
      tooling:
        patterns:
          - typescript
          - publint
          - '@arethetypeswrong/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
