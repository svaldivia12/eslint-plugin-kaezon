name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tests/types/public_api.test-d.ts imports from dist/, so the types test
      # needs a build before it can resolve the published entry point.
      - run: pnpm run build
      - run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The peer-isolation test imports the built package from dist/.
      - run: pnpm run build
      - run: pnpm test

  compat:
    name: Compat (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every version the "engines" field claims to support. The source suite
      # needs native type stripping (Node >= 22.18), so this job verifies the
      # published artefact instead: dist/ is what consumers actually run.
      matrix:
        node: ['20.19', '22.13', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Smoke test the built package
        run: |
          node --input-type=module -e "
          import kaezon from './dist/index.js'
          const presets = ['ts', 'vue', 'nuxt', 'nuxt_house']
          for (const name of presets) {
             if (!kaezon.configs[name]) throw new Error('missing preset: ' + name)
          }
          const rule_count = Object.keys(kaezon.rules).length
          if (rule_count !== 7) throw new Error('expected 7 rules, got ' + rule_count)
          const config = kaezon.createConfig({ preset: 'ts' })
          if (!config.plugins.kaezon) throw new Error('createConfig did not register the plugin')
          console.log('dist ok on ' + process.version + ' at v' + kaezon.meta.version)
          "

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check:package
